server {
  listen 80;
  server_tokens off;
  client_max_body_size 10m;

  # Docker DNS is intentionally resolved at request time so recreated services
  # are found without restarting this proxy.
  resolver 127.0.0.11 ipv6=off valid=5s;
  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:3000;

  location = /healthz { proxy_pass http://$backend_upstream/api/healthz/; }
  location /static/ { alias /static/; }
  location /media/ { alias /media/; }
  location /api/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # Cloudflare terminates TLS before reaching this loopback-only proxy.  Set,
  # rather than forward, the scheme so direct local clients cannot spoof it.
  location /portal/ { proxy_pass http://$frontend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://$frontend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
