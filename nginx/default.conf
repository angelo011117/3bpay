server {
  listen 80;
  client_max_body_size 10m;
  # Docker's embedded DNS is queried again as the cache expires, so a recreated
  # backend/frontend gets its new IP without an Nginx restart.
  resolver 127.0.0.11 ipv6=off valid=5s;
  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:3000;
  location /api/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /media/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
  location /portal/ { proxy_pass http://$frontend_upstream; }
  location / { proxy_pass http://$frontend_upstream; proxy_set_header Host $host; }
}
