services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U threebpay -d threebpay], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    image: 3bpay-backend:sprint1
    env_file: .env
    environment: {POSTGRES_HOST: db}
    volumes: [media_data:/app/media]
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    depends_on: {db: {condition: service_healthy}}
  scheduler:
    build: ./backend
    image: 3bpay-scheduler:sprint1
    env_file: .env
    environment: {POSTGRES_HOST: db}
    command: sh -c "while true; do python manage.py run_scheduler; sleep 60; done"
    depends_on: {db: {condition: service_healthy}}
  frontend: {build: ./frontend, image: 3bpay-frontend:sprint1}
  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend, frontend]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
volumes: {postgres_data: {}, media_data: {}}
