name: 3bpay

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    env_file: ${THREEBPAY_ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ./backend
    image: 3bpay/backend:production
    env_file: ${THREEBPAY_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: db
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    restart: unless-stopped
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  frontend:
    build: ./frontend
    image: 3bpay/frontend:production
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${THREEBPAY_PROXY_PORT:?Set THREEBPAY_PROXY_PORT in .env.production}:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro
      - static_data:/static:ro
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  scheduler:
    build: ./backend
    image: 3bpay/backend:production
    profiles: [scheduler]
    env_file: ${THREEBPAY_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: db
    command: sh -c "while true; do python manage.py run_scheduler; sleep 300; done"
    restart: unless-stopped
    networks: [app]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *default-logging

networks:
  app:
    name: 3bpay_app_net

volumes:
  postgres_data:
    name: 3bpay_postgres_data
  media_data:
    name: 3bpay_media_data
  static_data:
    name: 3bpay_static_data
